<path d="M380 150 H510 V310 H650"/><path d="M380 315 H545 V365 H650"/><path d="M380 480 H570 V420 H650"/><path d="M380 660 H590 V480 H650"/><path d="M650 585 H520 V870 H380"/><path d="M1220 485 H1350"/>
</g>
<g font-family="Arial" font-size="16" fill="#334155">
<text x="455" y="137">NO ACTION</text><text x="455" y="302">NO ACTION</text><text x="480" y="472">NO ACTION</text><text x="495" y="650">NO ACTION</text><text x="430" y="855">ON DELETE SET NULL</text><text x="1240" y="470">ON DELETE CASCADE</text>
</g>
<!-- table function -->
<g font-family="Arial" font-size="17" fill="#111827" stroke="#64748b" stroke-width="2">
<rect x="80" y="100" width="300" height="135" rx="8" fill="#eff6ff"/><rect x="80" y="265" width="300" height="115" rx="8" fill="#eff6ff"/>
<rect x="80" y="430" width="300" height="120" rx="8" fill="#eff6ff"/><rect x="80" y="600" width="300" height="150" rx="8" fill="#eff6ff"/>
<rect x="80" y="800" width="300" height="200" rx="8" fill="#f0fdf4"/>
<rect x="650" y="170" width="570" height="650" rx="8" fill="#fff1f2"/>
<rect x="1350" y="390" width="430" height="210" rx="8" fill="#fffbeb"/>
</g>
<g font-family="Arial" font-size="20" font-weight="bold" fill="#1e3a8a">
<text x="100" y="130">ISSUING_AGENCY</text><text x="100" y="295">VIOLATION_TYPE</text><text x="100" y="460">VIOLATION</text><text x="100" y="630">DISPOSITION</text>
</g>
<g font-family="Arial" font-size="16" fill="#111827">
<text x="100" y="160">PK, NN AGENCY_CODE NUMBER(5)</text><text x="100" y="185">NN AGENCY_NAME VARCHAR2(150)</text><text x="100" y="210">UQ, NN AGENCY_SHORT VARCHAR2(20)</text>
<text x="100" y="325">PK, NN VIOLATION_TYPE_DESC</text><text x="100" y="350">CK: P, V, T, M only</text>
<text x="100" y="490">PK, NN VIOLATION_CODE</text><text x="100" y="515">VIOLATION_PROC_DESC NULL</text>
<text x="100" y="660">PK, NN DISPOSITION_CODE</text><text x="100" y="685">NN DISPOSITION_TYPE</text><text x="100" y="710">DISPOSITION_DESC NULL</text>
<text x="100" y="830" font-weight="bold" fill="#166534">LOCATION</text><text x="100" y="860">PK, NN LOCATION_ID (identity)</text><text x="100" y="885">UQ, NN LOCATION_TEXT</text><text x="100" y="910">MAR_ID, XCOORD, YCOORD NULL</text><text x="100" y="935">LATITUDE NULL; CK -90..90</text><text x="100" y="960">LONGITUDE NULL; CK -180..180</text>
</g>
<g font-family="Arial" font-size="20" font-weight="bold" fill="#9f1239"><text x="675" y="205">PARKING_TICKET</text></g>
<g font-family="Arial" font-size="16" fill="#111827">
<text x="675" y="240">PK, NN TICKET_NUMBER NUMBER(12)</text><text x="675" y="267">UQ, NN SOURCE_OBJECT_ID NUMBER(12)</text>
<text x="675" y="294">FK, NN VIOLATION_TYPE_DESC VARCHAR2(1)</text><text x="675" y="321">NN ISSUE_DATE TIMESTAMP WITH TIME ZONE</text>
<text x="675" y="348">NN ISSUE_TIME NUMBER(4); CK 0..2359</text><text x="675" y="375">FK, NN AGENCY_CODE NUMBER(5)</text>
<text x="675" y="402">FK, NN VIOLATION_CODE VARCHAR2(10)</text><text x="675" y="429">FK LOCATION_ID NUMBER(12) NULL</text>
<text x="675" y="456">PLATE_STATE, VEHICLE_TYPE NULL</text><text x="675" y="483">NN MULTI_OWNER_NUMBER VARCHAR2(30)</text>
<text x="675" y="510">FK, NN DISPOSITION_CODE NUMBER(5)</text><text x="675" y="537">DISPOSITION_DATE TIMESTAMP WITH TIME ZONE NULL</text>
<text x="675" y="564">NN FINE_AMOUNT NUMBER(10,2); CK >= 0</text><text x="675" y="591">NN TOTAL_PAID NUMBER(10,2); CK >= 0</text>
<text x="675" y="618">NN GIS_LAST_MOD_DTTM TIMESTAMP WITH TIME ZONE</text>
<text x="675" y="675" font-size="17" font-weight="bold" fill="#9f1239">Each ticket: exactly 1 agency, category, violation, disposition;</text>
<text x="675" y="702" font-size="17" fill="#9f1239">0..1 location. Parent reference rows: 0..N tickets.</text>
<text x="675" y="729" font-size="17" fill="#9f1239">NO ACTION protects ticket history.</text>
</g>
<g font-family="Arial" font-size="20" font-weight="bold" fill="#92400e"><text x="1375" y="425">TICKET_PENALTY</text></g>
<g font-family="Arial" font-size="16" fill="#111827">
<text x="1375" y="460">PK, FK, NN TICKET_NUMBER</text><text x="1375" y="490">PK, NN PENALTY_STAGE; CK 1..5</text><text x="1375" y="520">NN PENALTY_AMOUNT; CK >= 0</text>
<text x="1375" y="560">Each stage row has exactly 1 ticket;</text><text x="1375" y="585">a ticket may have 0..5 stage rows.</text>
</g>
<text x="950" y="1080" text-anchor="middle" font-family="Arial" font-size="18" fill="#334155">Delete rules selected for Phase IV implementation: NO ACTION (reference tables), SET NULL (optional location), CASCADE (ticket penalty details).</text>
<text x="950" y="1115" text-anchor="middle" font-family="Arial" font-size="16" fill="#64748b">SET NULL and CASCADE are target rules; apply and verify them in the constraints and referential-action scripts.</text>
<text x="950" y="1170" text-anchor="middle" font-family="Arial" font-size="15" fill="#64748b">Student: TUYISENGE Kevin | ID: 20252SEN346 | Group I</text>
